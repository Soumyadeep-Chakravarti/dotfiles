#############################################
# Blur Configuration
#
# Background blur for transparent windows
# and layers. Balanced for performance on
# integrated + NVIDIA setup.
#
# See: https://wiki.hyprland.org/Configuring/Variables/#blur
#############################################

decoration {
  blur {
    enabled = true
    size = 5
    passes = 2
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = true
    popups = true
  }
}
