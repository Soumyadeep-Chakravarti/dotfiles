source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 3
  gaps_out = 6
  col.active_border = $color13
  col.inactive_border = $color10
}

decoration {
  rounding = 12
  shadow {
    enabled = true
    range = 3
    render_power = 1
    color = $color12
    color_inactive = $color10
  }
}

group {
  col.border_active = $color15
  groupbar {
    col.active = $color0
  }
}
