#############################################
# Core Variables
#
# Central variable definitions used across
# all configuration modules. Every path and
# identifier referenced elsewhere is defined
# here first.
#############################################

$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $scriptsDir/user

# Default applications
$term = kitty
$files = thunar
$editor = ${EDITOR:-nvim}

# Appearance paths
$wallDIR = $HOME/Pictures/wallpapers
$lock = $scriptsDir/system/LockScreen.sh
