#############################################
# Environment Variables
#
# Toolkit backends, XDG specs, NVIDIA driver
# configuration, cursor theming, and app-
# specific environment setup.
#
# See: https://wiki.hyprland.org/Configuring/Environment-variables/
#############################################

### Toolkit Backend ###
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = CLUTTER_BACKEND,wayland

### XDG Specifications ###
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

### Qt ###
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QUICK_CONTROLS_STYLE,org.hyprland.style

### Scaling (set to match monitor scale) ###
env = GDK_SCALE,1
env = QT_SCALE_FACTOR,1

### Cursor ###
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24

### Firefox ###
env = MOZ_ENABLE_WAYLAND,1

### Electron >28 ###
env = ELECTRON_OZONE_PLATFORM_HINT,auto

### NVIDIA (active - GPU detected) ###
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = GSK_RENDERER,ngl

### Variable Refresh Rate ###
env = GB_VARIABLE_REFRESH_RATE,1
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1
env = OGL_DEDICATED_HW_STATE_PER_CONTEXT,ENABLE_ROBUST
