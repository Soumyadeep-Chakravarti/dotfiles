#############################################
# Screenshot Keybindings
#
# Full screen, area, delayed, and active
# window screenshots via grim/slurp/swappy.
#############################################

# Standard screenshots (Print key)
bindd = $mainMod, Print, screenshot now, exec, $scriptsDir/screenshots/ScreenShot.sh --now
bindd = $mainMod SHIFT, Print, screenshot (area), exec, $scriptsDir/screenshots/ScreenShot.sh --area
bindd = $mainMod CTRL, Print, screenshot in 5s, exec, $scriptsDir/screenshots/ScreenShot.sh --in5
bindd = $mainMod CTRL SHIFT, Print, screenshot in 10s, exec, $scriptsDir/screenshots/ScreenShot.sh --in10
bindd = ALT, Print, screenshot active window, exec, $scriptsDir/screenshots/ScreenShot.sh --active

# Screenshot with swappy (annotation tool)
bindd = $mainMod SHIFT, S, screenshot (swappy), exec, $scriptsDir/screenshots/ScreenShot.sh --swappy

# Laptop screenshots (F6 - no PrtSc button)
bindd = $mainMod, F6, screenshot now, exec, $scriptsDir/screenshots/ScreenShot.sh --now
bindd = $mainMod SHIFT, F6, screenshot (area), exec, $scriptsDir/screenshots/ScreenShot.sh --area
bindd = $mainMod CTRL, F6, screenshot in 5s, exec, $scriptsDir/screenshots/ScreenShot.sh --in5
bindd = $mainMod ALT, F6, screenshot in 10s, exec, $scriptsDir/screenshots/ScreenShot.sh --in10
bindd = ALT, F6, screenshot active window, exec, $scriptsDir/screenshots/ScreenShot.sh --active
