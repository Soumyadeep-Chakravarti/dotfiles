#############################################
# Application Launchers
#
# Keybindings for opening applications:
# terminal, file manager, browser, app
# launcher (rofi), and overview.
#############################################

# App launcher (rofi)
bindd = $mainMod, D, app launcher, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window

# Terminal
bindd = $mainMod, Return, Open terminal, exec, $term

# File manager
bindd = $mainMod, E, file manager, exec, $files

# Browser
bindd = $mainMod, B, open default browser, exec, xdg-open "https://"

# Desktop overview (quickshell, falls back to ags)
bindd = $mainMod, A, desktop overview, exec, $scriptsDir/utils/OverviewToggle.sh
