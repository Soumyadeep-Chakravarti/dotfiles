#############################################
# Media & Hardware Keybindings
#
# Volume, brightness, media playback,
# airplane mode, sleep, and keyboard
# brightness controls.
#############################################

# Volume
bindeld = , xf86audioraisevolume, volume up, exec, $scriptsDir/media/Volume.sh --inc
bindeld = , xf86audiolowervolume, volume down, exec, $scriptsDir/media/Volume.sh --dec
bindeld = ALT, xf86audioraisevolume, volume up precise, exec, $scriptsDir/media/Volume.sh --inc-precise
bindeld = ALT, xf86audiolowervolume, volume down precise, exec, $scriptsDir/media/Volume.sh --dec-precise
bindld = , xf86AudioMicMute, toggle mic mute, exec, $scriptsDir/media/Volume.sh --toggle-mic
bindld = , xf86audiomute, toggle mute, exec, $scriptsDir/media/Volume.sh --toggle

# Media playback
bindld = , xf86AudioPlayPause, play/pause, exec, $scriptsDir/media/MediaCtrl.sh --pause
bindld = , xf86AudioPause, pause, exec, $scriptsDir/media/MediaCtrl.sh --pause
bindld = , xf86AudioPlay, play, exec, $scriptsDir/media/MediaCtrl.sh --pause
bindld = , xf86AudioNext, next track, exec, $scriptsDir/media/MediaCtrl.sh --nxt
bindld = , xf86AudioPrev, previous track, exec, $scriptsDir/media/MediaCtrl.sh --prv
bindld = , xf86audiostop, stop, exec, $scriptsDir/media/MediaCtrl.sh --stop

# Power
bindld = , xf86Sleep, sleep, exec, systemctl suspend
bindld = , xf86Rfkill, airplane mode, exec, $scriptsDir/system/AirplaneMode.sh

# Keyboard brightness (ASUS)
bindld = , xf86KbdBrightnessDown, keyboard brightness down, exec, $scriptsDir/display/BrightnessKbd.sh --dec
bindld = , xf86KbdBrightnessUp, keyboard brightness up, exec, $scriptsDir/display/BrightnessKbd.sh --inc

# Monitor brightness
bindld = , xf86MonBrightnessDown, brightness down, exec, $scriptsDir/display/Brightness.sh --dec
bindld = , xf86MonBrightnessUp, brightness up, exec, $scriptsDir/display/Brightness.sh --inc

# ASUS specific
bindld = , xf86Launch1, rog control center, exec, rog-control-center
bindld = , xf86Launch3, switch keyboard RGB profile, exec, asusctl led-mode -n
bindld = , xf86Launch4, change fan profile, exec, asusctl profile -n

# Touchpad toggle
bindld = , xf86TouchpadToggle, toggle touchpad, exec, $scriptsDir/display/TouchPad.sh
