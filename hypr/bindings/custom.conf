#############################################
# Custom Keybindings
#
# User-defined shortcuts. Add personal
# keybindings here. This file is not
# modified during dotfile updates.
#############################################

# System
bindd = CTRL ALT, Delete, exit Hyprland, exec, hyprctl dispatch exit 0
bindd = CTRL ALT, L, lock screen, exec, $scriptsDir/system/LockScreen.sh
bindd = CTRL ALT, P, powermenu, exec, $scriptsDir/utils/Wlogout.sh
bindd = $mainMod SHIFT, N, notification panel, exec, swaync-client -t -sw
bindd = $mainMod SHIFT, E, quick settings menu, exec, $scriptsDir/utils/Kool_Quick_Settings.sh

# Features
bindd = $mainMod, T, global theme switcher, exec, $scriptsDir/theme/ThemeChanger.sh
bindd = $mainMod, H, help / cheat sheet, exec, $scriptsDir/rofi/KeyHints.sh
bindd = $mainMod ALT, R, refresh bar and menus, exec, $scriptsDir/display/Refresh.sh
bindd = $mainMod ALT, E, emoji menu, exec, $scriptsDir/rofi/RofiEmoji.sh
bindd = $mainMod, S, web search, exec, $scriptsDir/rofi/RofiSearch.sh
bindd = $mainMod CTRL, S, window switcher, exec, rofi -show window
bindd = $mainMod ALT, O, toggle blur, exec, $scriptsDir/theme/ChangeBlur.sh
bindd = $mainMod SHIFT, G, toggle game mode, exec, $scriptsDir/system/GameMode.sh
bindd = $mainMod ALT, L, toggle master/dwindle layout, exec, $scriptsDir/theme/ChangeLayout.sh
bindd = $mainMod ALT, V, clipboard manager, exec, $scriptsDir/utils/ClipManager.sh
bindd = $mainMod CTRL, R, rofi theme selector, exec, $scriptsDir/rofi/RofiThemeSelector.sh
bindd = $mainMod CTRL SHIFT, R, rofi theme selector (modified), exec, pkill rofi || true && $scriptsDir/rofi/RofiThemeSelector-modified.sh

# Waybar
bindd = $mainMod CTRL ALT, B, toggle waybar on/off, exec, pkill -SIGUSR1 waybar
bindd = $mainMod CTRL, B, waybar styles menu, exec, $scriptsDir/waybar/WaybarStyles.sh
bindd = $mainMod ALT, B, waybar layout menu, exec, $scriptsDir/waybar/WaybarLayout.sh

# Night light
bindd = $mainMod, N, toggle night light, exec, $scriptsDir/system/Hyprsunset.sh toggle

# Drop-down terminal
bindd = $mainMod SHIFT, Return, drop-down terminal, exec, $scriptsDir/utils/Dropterminal.sh $term

# Desktop zooming
bindd = $mainMod ALT, mouse_down, zoom in, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
bindd = $mainMod ALT, mouse_up, zoom out, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')"

# User scripts
bindd = $mainMod SHIFT, M, online music, exec, $UserScripts/RofiBeats.sh
bindd = $mainMod, W, select wallpaper, exec, $UserScripts/WallpaperSelect.sh
bindd = $mainMod SHIFT, W, wallpaper effects, exec, $UserScripts/WallpaperEffects.sh
bindd = CTRL ALT, W, random wallpaper, exec, $UserScripts/WallpaperRandom.sh
bindd = $mainMod SHIFT, K, search keybinds, exec, $scriptsDir/input/KeyBinds.sh
bindd = $mainMod SHIFT, A, animations menu, exec, $scriptsDir/theme/Animations.sh
bindd = $mainMod SHIFT, O, change oh-my-zsh theme, exec, $UserScripts/ZshChangeTheme.sh
bindd = $mainMod ALT, C, calculator, exec, $UserScripts/RofiCalc.sh

# Keyboard layout switching
bindlnd = ALT_L, SHIFT_L, switch keyboard layout globally, exec, $scriptsDir/input/KeyboardLayout.sh switch
bindlnd = SHIFT_L, ALT_L, switch keyboard layout per-window, exec, $scriptsDir/utils/Tak0-Per-Window-Switch.sh

# Recording
bind = $mainMod SHIFT, R, exec, ~/scripts/record.sh
