#############################################
# Workspace Rules
#
# Monitor assignments, per-workspace
# behaviors, and auto-launch apps.
#
# Managed by nwg-displays for monitor
# assignments. Add custom rules below.
#
# See: https://wiki.hyprland.org/Configuring/Workspace-Rules/
#############################################

# Idle inhibit for fullscreen apps
windowrule = match:fullscreen true, idle_inhibit fullscreen

# No initial focus for JetBrains hover windows
windowrule = match:class ^(jetbrains-*), no_initial_focus on
windowrule = match:title ^(wind.*)$, no_initial_focus on

# Games: no blur, fullscreen
windowrule = match:tag games, no_blur on, fullscreen 0
