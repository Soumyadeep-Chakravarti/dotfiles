#############################################
# Hyprland Configuration
#
# Main entry point. Sources all modules
# in dependency order.
#
# Architecture:
#   core/       - Variables, env, compositor
#   display/    - Monitors, workspaces
#   input/      - Keyboard, mouse, touchpad, gestures
#   appearance/ - Decoration, animations, blur, colors, cursor
#   windows/    - Focus, behaviors
#   bindings/   - All keybindings by category
#   rules/      - Window rules, floating, opacity, layers
#   services/   - Startup, defaults
#   local/      - User overrides (not tracked)
#############################################

### Initial boot ###
exec-once = $HOME/.config/hypr/initial-boot.sh

### Core ###
source = core/variables.conf
source = core/environment.conf
source = core/compositor.conf
source = core/misc.conf

### Display ###
source = display/monitors.conf
source = display/workspaces.conf

### Input ###
source = input/keyboard.conf
source = input/mouse.conf
source = input/touchpad.conf
source = input/gestures.conf

### Appearance ###
source = appearance/colors.conf
source = appearance/decoration.conf
source = appearance/animations.conf
source = appearance/blur.conf
source = appearance/cursor.conf

### Keybindings ###
source = bindings/applications.conf
source = bindings/windows.conf
source = bindings/workspaces.conf
source = bindings/media.conf
source = bindings/screenshots.conf
source = bindings/custom.conf

### Rules ###
source = rules/windows.conf
source = rules/floating.conf
source = rules/opacity.conf
source = rules/layers.conf
source = rules/workspaces.conf

### Services ###
source = services/startup.conf
source = services/daemons.conf

### Local overrides (create this file for personal tweaks) ###
source = local/override.conf
