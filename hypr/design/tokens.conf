#############################################
# Design Tokens v0.1
#
# Semantic color contract for the workstation.
# All application configs should reference
# these roles instead of raw wallust colors.
#
# Architecture:
#   wallust-hyprland.conf  → raw palette
#   tokens.conf            → semantic mapping
#   app configs            → import tokens.conf
#
# Every token must pay rent:
#   It exists because it removes a repeated decision.
#############################################

### Raw palette (from wallust, regenerated on wallpaper change) ###
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

### Surface ###
# Background: the deepest layer behind all windows
background = $background

# Surface: panel/bar background, elevated surfaces
surface = $color0

# Surface alt: slightly raised or differentiated surface
surface_alt = $color11

# Foreground: primary text on background/surface
foreground = $foreground

### Accent ###
# The single color that guides the eye.
# Used for: active borders, active tabs, cursor, selections.
accent = $color12

# Accent dimmed: hover states, subtle emphasis
accent_dim = $color10

# Accent bright: active indicators, focused elements
accent_bright = $color14

### Status ###
# Success: completed states, healthy status
success = $color7

# Warning: attention required, non-critical alerts
warning = $color8

# Error: failure, critical alerts
error = $color6

### Border ###
# Active border: focused window
border_active = $accent

# Inactive border: unfocused windows
border_inactive = $color0

# Group border: tabbed window groups
border_group = $color15

### Text ###
# Muted: secondary text, labels, timestamps
text_muted = $color8

# Subtle: disabled text, placeholders
subtle = $color7

### Shadows ###
shadow = $accent
shadow_inactive = $accent_dim
