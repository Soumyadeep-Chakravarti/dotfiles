#############################################
# Startup Services
#
# Applications and services launched at
# Hyprland startup. Ordered by dependency.
#
# See: https://wiki.hyprland.org/Configuring/Keywords/#exec-once
#############################################

# Wallpaper engine
exec-once = awww-daemon --format xrgb

# D-Bus and systemd environment
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Authentication
exec-once = $scriptsDir/system/Polkit.sh

# Network and Bluetooth
exec-once = nm-applet --indicator
exec-once = blueman-applet

# Bar and shell
exec-once = waybar
exec-once = qs -c overview

# Idle management
exec-once = hypridle
exec-once = $scriptsDir/system/Hyprsunset.sh init

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Layout keybind initialization
exec-once = $scriptsDir/input/KeybindsLayoutInit.sh
